<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    h1 {
      font-size: 18px;
      margin-top: 0;
      color: #333;
    }
    button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #3367d6;
    }
    button.restore {
      background-color: #aaa;
    }
    button.restore:hover {
      background-color: #888;
    }
    select {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .footer {
      margin-top: 15px;
      text-align: center;
      font-size: 12px;
      color: #666;
    }
    .service-info {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1 data-i18n="popupTitle">Web Page Translator</h1>
  
  <label for="language-select" data-i18n="targetLanguageLabel">Target Language:</label>
  <select id="language-select">
    <option value="en">English</option>
    <option value="es">Spanish</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="zh-CN">Chinese (Simplified)</option>
    <option value="ja">Japanese</option>
    <option value="ko">Korean</option>
    <option value="ru">Russian</option>
    <option value="ar">Arabic</option>
  </select>
  
  
  <button id="translate-btn" data-i18n="translateButton">Translate Page</button>
  <button id="restore-btn" class="restore" data-i18n="restoreButton">Show Original</button>
  <button id="options-btn" data-i18n="optionsButton">Options</button>
  
  <div class="service-info" id="service-info">
    Using Google Translate (Free)
  </div>
  
  <div class="footer">
    <p>Translate any webpage with one click</p>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
