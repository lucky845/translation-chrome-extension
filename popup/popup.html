<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title data-i18n="popupTitle">网页翻译</title>
  <style>
    :root {
      --surface: #ffffff;
      --sunken: #f4f4f9;
      --ink: #1a1a24;
      --ink-mid: #4c4c5c;
      --ink-soft: #7a7a8c;
      --rule: #e4e4ec;
      --rule-strong: #d2d2de;
      --accent: #3a30c4;
      --accent-hover: #2e259f;
      --accent-tint: #eeedfb;
      --local: #17694f;
      --local-tint: #e8f3ee;
      --warn: #a9560b;
      --warn-tint: #fbf0e3;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", "Noto Sans SC", sans-serif;
      --chevron: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%237a7a8c' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    }

    * { box-sizing: border-box; }

    body {
      width: 320px;
      margin: 0;
      padding: 0;
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--surface);
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- 顶栏 ---------- */
    .top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 14px 16px 10px;
    }
    .top h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .top .link {
      padding: 2px 0;
      font-family: inherit;
      font-size: 12px;
      color: var(--ink-soft);
      background: none;
      border: 0;
      border-bottom: 1px solid transparent;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .top .link:hover { color: var(--accent); border-bottom-color: var(--accent); }

    /* ---------- 语言对：这是弹窗的主角 ---------- */
    .pair {
      margin: 0 16px;
      padding: 2px 0;
      background: var(--sunken);
      border-radius: 10px;
    }
    .pair-row { padding: 9px 12px 10px; }
    .pair-row + .pair-row { border-top: 1px solid var(--rule); }

    .pair-label {
      display: block;
      margin-bottom: 3px;
      font-size: 11px;
      letter-spacing: 0.02em;
      color: var(--ink-soft);
    }

    select {
      width: 100%;
      padding: 0 20px 0 0;
      font-family: inherit;
      color: var(--ink);
      background-color: transparent;
      background-image: var(--chevron);
      background-repeat: no-repeat;
      background-position: right 2px center;
      border: 0;
      border-radius: 6px;
      outline: none;
      appearance: none;
      cursor: pointer;
      text-overflow: ellipsis;
    }
    #source-language {
      font-size: 13px;
      color: var(--ink-mid);
    }
    /* 目标语言是唯一真正需要人做的决定，字号最大、字重最实 */
    #target-language {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.005em;
    }
    select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* ---------- 主操作 ---------- */
    .actions {
      display: grid;
      gap: 7px;
      padding: 14px 16px 0;
    }
    button.primary,
    button.ghost {
      width: 100%;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    button.primary {
      color: #fff;
      background: var(--accent);
      border: 1px solid var(--accent);
    }
    button.primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    button.ghost {
      color: var(--ink-mid);
      background: var(--surface);
      border: 1px solid var(--rule-strong);
      font-weight: 500;
    }
    button.ghost:hover:not(:disabled) {
      color: var(--ink);
      border-color: var(--ink-soft);
    }
    button:disabled {
      color: var(--ink-soft);
      background: var(--sunken);
      border-color: var(--rule);
      cursor: not-allowed;
    }
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ---------- 状态：一个点 + 一句话，不用徽章 ---------- */
    .engine-info {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      margin: 12px 16px 0;
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--ink-soft);
    }
    .engine-info::before {
      content: "";
      flex: 0 0 auto;
      width: 6px;
      height: 6px;
      margin-top: 5px;
      border-radius: 50%;
      background: var(--rule-strong);
    }
    .engine-info.ok { color: var(--local); }
    .engine-info.ok::before { background: var(--local); }
    .engine-info.warn { color: var(--warn); }
    .engine-info.warn::before { background: var(--warn); }

    .status {
      margin: 6px 16px 0;
      font-size: 11.5px;
      line-height: 1.45;
    }
    .status:empty { display: none; }
    .status.ok { color: var(--local); }
    .status.warn { color: var(--warn); }
    .status.info { color: var(--ink-soft); }

    /* ---------- 底部：偏好与快捷键，安静地待着 ---------- */
    .foot {
      margin-top: 12px;
      padding: 10px 16px 12px;
      border-top: 1px solid var(--rule);
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--ink-mid);
      cursor: pointer;
    }
    .toggle input {
      flex: 0 0 auto;
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .hint {
      margin: 7px 0 0;
      font-size: 11px;
      color: var(--ink-soft);
    }
    .hint kbd {
      padding: 1px 4px;
      font-family: inherit;
      font-size: 10.5px;
      color: var(--ink-mid);
      background: var(--sunken);
      border: 1px solid var(--rule);
      border-radius: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="top">
    <h1 data-i18n="popupTitle">网页翻译</h1>
    <button type="button" class="link" id="options-btn" data-i18n="optionsButton">设置</button>
  </div>

  <div class="pair">
    <div class="pair-row">
      <label class="pair-label" for="source-language" data-i18n="sourceLanguageLabel">源语言</label>
      <select id="source-language"></select>
    </div>
    <div class="pair-row">
      <label class="pair-label" for="target-language" data-i18n="targetLanguageLabel">译为</label>
      <select id="target-language"></select>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="primary" id="translate-btn" data-i18n="translateButton">翻译此页</button>
    <button type="button" class="ghost" id="restore-btn" data-i18n="restoreButton" disabled>显示原文</button>
  </div>

  <div class="engine-info" id="engine-info">正在检测翻译方式…</div>
  <div class="status" id="status"></div>

  <div class="foot">
    <label class="toggle">
      <input type="checkbox" id="auto-translate">
      <span data-i18n="autoTranslateLabel">自动翻译非目标语言页面</span>
    </label>
    <p class="hint">
      <span data-i18n="shortcutHint">快捷键</span> <kbd>Alt</kbd>+<kbd>T</kbd>
    </p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
